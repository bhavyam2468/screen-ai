name: source checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check installer shell syntax
        run: bash -n install.sh setup.sh uninstall.sh update.sh

      - name: Test setup Git synchronization
        run: python3 -m unittest discover -s tests -v

      - name: Check whitespace and tracked build output
        run: |
          git diff --check HEAD^ HEAD
          if git ls-files | grep -E '^(dist|src-tauri/target|target)/'; then
            echo "Generated application output must not be committed." >&2
            exit 1
          fi

      - name: Verify JavaScript lockfile without building
        run: npm ci --ignore-scripts --no-audit --no-fund

# This repository distributes source, not Linux binaries. The application is
# compiled on the user's machine by install.sh or screen-ai-update.
