[package]
name = "screen-ai"
version = "0.2.0"
description = "Invoke an AI overlay on your screen — screenshot + prompt, streaming reply bubble."
authors = ["screen-ai"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
base64 = "0.22"
image = "0.25"
xcap = "0.4"
dirs = "5"
semver = "1"
sha2 = "0.10"
# NOTE: gtk/gdk/cairo/gtk-layer-shell MUST stay on 0.18 — the same major wry/tao
# link (Cargo.lock pins a single gtk 0.18.x). A second GTK major = subtle breakage.
# After any `cargo update`, confirm with: cargo tree -i gtk
gtk = "0.18"
gdk = "0.18"
cairo-rs = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
