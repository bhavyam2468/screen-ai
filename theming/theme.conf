# Screen AI theme file
# Location: ~/.config/screen-ai/theme.conf
#
# Created once on first launch. Edit it any time: Screen AI watches this file
# and the palette source files, so changes apply without restarting.
# Lines starting with '#' are comments. Remove the '#' to enable an option.

[palette]
# Which color sources to use, in priority order:
#   auto     explicit colors below, then Matugen, then Qt/KDE, then GTK, then built-in
#   matugen  only Matugen output (source_file below)
#   qt       only the Qt/KDE color scheme
#   gtk      only GTK colors (gtk-4.0 / gtk-3.0 gtk.css)
#   builtin  Screen AI's own dark/light colors
source = auto

# Matugen (or any tool) writes a [palette] file here. The bundled Matugen
# template in theming/matugen/ writes this file.
# source_file = ~/.config/screen-ai/colors.conf

# Explicit colors always win over every other source. Uncomment to pin any role.
# window      = #141318
# window_text = #e6e1e5
# base        = #1d1b20
# text        = #e6e1e5
# highlight   = #d0bcff
# highlighted_text = #381e72
# link        = #ccc2dc

[shape]
# Card corner radius in px (0 to 48).
# If unset, Screen AI borrows `geometry-corner-radius` from your compositor (e.g. Niri),
# falling back to 18px.
# radius = 18

# Inner and control radii:
# - inner_radius: used for inner panels, previews, and chat message bubbles.
#   (Defaults to max(4, radius - 4) if unset).
# - control_radius: used for buttons, inputs, pills, and toggles.
#   (Defaults to max(4, radius - 8) if unset).
# inner_radius = 14
# control_radius = 10

# Border width of the main card in px (0 to 16).
# If unset, borrows from Niri's `focus-ring { width }` or `border { width }`,
# capped at 2px — a width meant for a full window is too heavy on a small card.
# border_width = 2

# Border colors for the floating card:
# active_border: applied while Screen AI holds the keyboard.
#                Borrowing order: this setting -> Niri focus-ring active-color -> accent color.
# inactive_border: applied once the keyboard has moved to another window.
#                  Borrowing order: this setting -> Niri focus-ring inactive-color -> theme surface outline.
# active_border   = #94cdf7
# inactive_border = #8b9198

# Outer screen gap / margin in px (0 to 120).
# Borrows from Niri `layout { gaps }`, defaulting to 24px.
# gap = 24

# Outer drop shadow for the dock card, as one CSS box-shadow string. It wins over
# the [appearance] shadow_* parts. If neither is set, Screen AI borrows and
# translates Niri's `layout { shadow }` into CSS, or defaults to
# "0 24px 80px -28px rgba(4, 10, 20, 0.72)".
# shadow = 0 24px 80px -28px rgba(4, 10, 20, 0.72)

[appearance]
# Everything Settings -> Appearance can set, and the surface effects it cannot.
# A value written here wins over the one the panel saved; removing the line hands
# that setting back to the panel. Screen AI rewrites these three keys whenever you
# save Appearance, so the file always mirrors what the menu shows.

# Palette mode: auto, dark, light, or qt (follow the Qt/KDE/Matugen colors).
# theme = auto

# Where the card sits: bottom-left, bottom-center, or bottom-right.
# position = bottom-right

# Card surface opacity, 10 to 100 (%). This is multiplied into every surface the
# card paints — the plate, the command palette, chat bubbles, code blocks,
# settings fields — so nothing stays solid while the rest of the card thins out.
# Text and borders keep their own contrast, so the card stays readable.
# opacity = 100

# Backdrop blur in px (0 to 64, 0 = off). An overlay window cannot read the
# desktop behind it, so Screen AI blurs the screenshot it just took (kept at max
# 1200px wide) and paints it inside the card. Only visible while opacity is below
# 100; below ~4px the upscaling is noticeable on a 4K display.
# blur = 0

# Film grain over the finished card, 0 to 100 (%). 4-12 is a light texture;
# past ~30 it starts eating legibility. 0 = off.
# noise = 0

# Drop shadow, as parts instead of one CSS string, so it can be dialled to zero:
#   shadow_intensity  0 to 200 (%)  — 0 removes the shadow completely, focus glow
#                                   included, so the card has no soft edges at all
#   shadow_blur       0 to 400 (px) — 0 is a hard-edged silhouette
#   shadow_offset     px, vertical offset (negative lifts it up)
#   shadow_spread     px, negative shrinks it past the card's edge
#   shadow_color      #rrggbb, #rrggbbaa, or rgb()/rgba() — intensity scales its alpha
# Any of these replaces the shadow borrowed from the compositor with Screen AI's
# own defaults (0 24px 80px -28px at 72% black, scaled by intensity).
# shadow_intensity = 100
# shadow_blur = 80
# shadow_offset = 24
# shadow_spread = -28
# shadow_color = #040a14

[type]
# font = Inter
# mono = JetBrains Mono
# size = 14

[motion]
# mode = reduced      # disables non-essential animation (also: off)
# speed = 1.0         # 0.5 is twice as fast, 2.0 is twice as slow (range 0.1 to 4)
#                     # 0.1 removes the summon animation almost entirely

[input]
# How the overlay holds the keyboard while it is open.
#   auto       grab on summon, hand it back the moment another window takes
#              focus. Only compositors that report focus changes can do the
#              second half: niri, Hyprland and sway.
#   on-demand  never grab. The card types after you click it, everywhere.
#   sticky     keep the grab until the overlay is dismissed.
# On compositors that publish no focus events (Plasma, river, labwc) `auto`
# cannot notice that you clicked something else: dismiss to type elsewhere, or
# choose on-demand. $SCREEN_AI_KEYBOARD overrides this key.
# keyboard = auto
