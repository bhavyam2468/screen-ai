# Template for Matugen. Rendered to ~/.config/screen-ai/colors.conf.
# Screen AI reads the [palette] section and leaves the rest of the file alone.
[palette]
window = "{{colors.surface.default.hex}}"
window_text = "{{colors.on_surface.default.hex}}"
base = "{{colors.surface_container.default.hex}}"
text = "{{colors.on_surface.default.hex}}"
alternate_base = "{{colors.surface_container_low.default.hex}}"
button = "{{colors.surface_container_high.default.hex}}"
button_text = "{{colors.on_surface.default.hex}}"
highlight = "{{colors.primary.default.hex}}"
highlighted_text = "{{colors.on_primary.default.hex}}"
link = "{{colors.tertiary.default.hex}}"
tooltip_base = "{{colors.surface_container_highest.default.hex}}"
tooltip_text = "{{colors.on_surface_variant.default.hex}}"
